          <!-- fila 1 -->
          <circle class="mx-dot" cx="24" cy="64" r="2.1"/>
          <circle class="mx-dot" cx="31" cy="64" r="2.1"/>
          <circle class="mx-dot" cx="38" cy="64" r="2.1"/>
          <circle class="mx-dot" cx="45" cy="64" r="2.1"/>
