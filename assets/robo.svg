        <circle class="mouth-led ml2" cx="36.5" cy="37.5" r="2"/>
        <circle class="mouth-led ml3" cx="43"   cy="37.5" r="2"/>
        <circle class="mouth-led ml4" cx="49.5" cy="37.5" r="2"/>

        <!-- nube de pensamiento -->
        <g class="g-thought" opacity="0">
