      </g>

      <!-- == CUERPO (siempre encima) == -->
      <g class="g-body">
        <rect x="16" y="48" width="48" height="40" rx="9" fill="#252b3d"/>
        <rect x="16" y="48" width="48" height="40" rx="9"
              fill="none" stroke="#3a4260" stroke-width="1.5"/>
        <rect class="chest-panel" x="20" y="53" width="40" height="30" rx="7"
              fill="#0d1120" stroke="#2a3050" stroke-width="1.2"/>
        <circle class="chest-led cl1" cx="30" cy="68" r="4"/>
        <circle class="chest-led cl2" cx="40" cy="68" r="4"/>
        <circle class="chest-led cl3" cx="50" cy="68" r="4"/>

        <!-- Matriz LED 5x4 (oculta por defecto) -->
        <g class="g-matrix" opacity="0">
          <rect x="21" y="54" width="38" height="28" rx="6" fill="#0d1120"/>
          <!-- fila 0 -->
          <circle class="mx-dot" cx="24" cy="57" r="2.1"/>
          <circle class="mx-dot" cx="31" cy="57" r="2.1"/>
          <circle class="mx-dot" cx="38" cy="57" r="2.1"/>
          <circle class="mx-dot" cx="45" cy="57" r="2.1"/>
