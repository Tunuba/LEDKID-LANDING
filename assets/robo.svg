          <circle cx="32" cy="-14" r="3.5" fill="rgba(0,212,170,.18)" stroke="#00d4aa" stroke-width="0.8"/>
          <circle cx="26" cy="-19" r="3"   fill="rgba(0,212,170,.18)" stroke="#00d4aa" stroke-width="0.8"/>
          <circle cx="36" cy="-22" r="5.5" fill="rgba(0,212,170,.22)" stroke="#00d4aa" stroke-width="0.8"/>
