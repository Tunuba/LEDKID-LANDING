          <circle cx="40" cy="-21" r="1" fill="#00ffc8" opacity="0.8"/>
        </g>
      </g>

      <!-- == BRAZOS == -->
      <g class="g-arm-l">
        <rect x="4"  y="52" width="12" height="32" rx="5"
              fill="#252b3d" stroke="#3a4260" stroke-width="1.2"/>
        <ellipse cx="10" cy="86" rx="7" ry="5"
