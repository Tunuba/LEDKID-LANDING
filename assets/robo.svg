<!-- BOTITO, el mascota de LEDKID. ARCHIVO GENERADO — NO SE EDITA A MANO.
     Lo escribe frontend/scripts/exportar-robo-landing.mjs leyendo
     frontend/src/components/RoboMascot.vue, que es el BOTITO que el niño ve dentro
     del simulador. Si el componente cambia, se vuelve a correr el script.
     El CSS va DENTRO a proposito: sin el, la boca sale negra y nada se mueve. -->
<svg class="robo-svg"
         viewBox="0 -24 80 158" width="100%" height="100%"
         xmlns="http://www.w3.org/2000/svg"
         overflow="visible">
<style>
/* -- Breathing animation (replaces GSAP breath tween) -- */
.g-body.breathing {
  animation: body-breathe 3.2s ease-in-out infinite;
}
@keyframes body-breathe {
  0%, 100% { transform: scale(1, 1); }
  50%      { transform: scale(1.018, 0.982); }
}


/* -- LEDs animados -- */
.ant-led {
  animation: ant-blink 1.6s ease-in-out infinite;
  filter: drop-shadow(0 0 4px #00ffc8);
}
@keyframes ant-blink {
  0%,38%,62%,100% { opacity: 1; }
  50%             { opacity: .04; }
}


/* Modo LISTEN: antena parpadea rapido */
.mood-listen .ant-led {
  animation: ant-blink-fast 0.5s ease-in-out infinite;
}
@keyframes ant-blink-fast {
  0%,100% { opacity: 1;    }
  50%     { opacity: 0.08; }
}


.mouth-led { fill: #00d4aa; }

.ml1 { animation: mouth-run 1s 0s    linear infinite; }

.ml2 { animation: mouth-run 1s .25s  linear infinite; }

.ml3 { animation: mouth-run 1s .5s   linear infinite; }

.ml4 { animation: mouth-run 1s .75s  linear infinite; }
@keyframes mouth-run {
  0%,100% { opacity: .1;  }
  18%     { opacity: 1; filter: drop-shadow(0 0 5px #00ffc8); }
}


/* Modo SPEAK: boca va mas rapido */
.mood-speak .ml1 { animation-duration: 0.35s; }


/* Ojos -- glow base */
.g-eye-l circle:first-child,
.g-eye-r circle:first-child {
  animation: eye-glow 2s ease-in-out infinite;
}
@keyframes eye-glow {
  0%,100% { filter: drop-shadow(0 0 4px #00ffc8);  }
  50%     { filter: drop-shadow(0 0 14px #00ffc8); }
}


/* Modo THINK: ojos hacen glow intenso */
.mood-think .g-eye-l circle:first-child,
.mood-think .g-eye-r circle:first-child {
  animation: eye-glow-think 0.55s ease-in-out infinite;
}
@keyframes eye-glow-think {
  0%,100% { filter: drop-shadow(0 0 6px currentColor);  }
  50%     { filter: drop-shadow(0 0 18px currentColor); }
}


/* Modo SPEAK: ojos pulsan al ritmo del habla */
.mood-speak .g-eye-l circle:first-child,
.mood-speak .g-eye-r circle:first-child {
  animation: eye-speak-pulse 0.42s ease-in-out infinite alternate;
}
@keyframes eye-speak-pulse {
  from { filter: drop-shadow(0 0 4px #00ffc8); }
  to   { filter: drop-shadow(0 0 22px #00ffc8); }
}


.mx-dot { fill: #00ffc8; }


.cl1 { fill: #ff3d52; animation: chest-seq 1.2s 0s   ease-in-out infinite; }

.cl2 { fill: #00d4aa; animation: chest-seq 1.2s .4s  ease-in-out infinite; }

.cl3 { fill: #ffd700; animation: chest-seq 1.2s .8s  ease-in-out infinite; }
@keyframes chest-seq {
  0%,100% { opacity: .15; }
  33%     { opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
}


/* Modo THINK: LEDs del pecho hacen scan horizontal */
.mood-think .cl1 { animation: chest-scan 0.9s 0s   linear infinite; }
@keyframes chest-scan {
  0%,100% { opacity: .1;  fill: #00ffc8; }
  40%     { opacity: 1;   fill: #ffffff; filter: drop-shadow(0 0 10px #00ffc8); }
}
</style>

      <ellipse class="g-shadow" cx="40" cy="115" rx="20" ry="4" fill="rgba(0,0,0,.28)"/>

      <!-- == CABEZA == -->
      <g class="g-head">
        <g class="g-antenna">
          <line x1="40" y1="4" x2="40" y2="-3"
                stroke="#8899bb" stroke-width="2.2" stroke-linecap="round"/>
          <circle class="ant-led" cx="40" cy="-3" r="3.5" fill="#00ffc8"/>
        </g>
        <rect x="16" y="4"  width="48" height="40" rx="9" fill="#2a3148"/>
        <rect x="16" y="4"  width="48" height="40" rx="9"
              fill="none" stroke="#4a5578" stroke-width="1.5"/>
        <rect x="18" y="6"  width="44" height="7"  rx="4" fill="white" opacity=".05"/>

        <!-- ojo izquierdo -->
        <rect x="22" y="15" width="15" height="15" rx="4.5" fill="#0d1120"/>
