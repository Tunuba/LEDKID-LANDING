<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEDKID — Robótica para todos</title>
<meta name="description" content="LEDKID: simulador de circuitos, kits de robótica y academia para colegios de Guatemala.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M7 15 Q7 2 16 2 Q25 2 25 15 Z' fill='%23FFAD00'/><rect x='7' y='14' width='18' height='11' rx='2' fill='%23FFAD00'/><rect x='6' y='24' width='20' height='3' rx='1.5' fill='%23FFAD00'/><rect x='9' y='27' width='5' height='4' rx='1' fill='%23FFAD00'/><rect x='18' y='27' width='5' height='4' rx='1' fill='%23FFAD00'/></svg>">
<style>
  :root { --ambar:#FFAD00; --tinta:#111318; --papel:#f7f8fa; --tenue:#6b7280; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--papel); color: var(--tinta);
    min-height: 100dvh; display: grid; place-items: center;
    padding: 24px; line-height: 1.5;
  }
  main { text-align: center; max-width: 32rem; }
  .marca { display:flex; align-items:center; justify-content:center; gap:.6rem; margin-bottom:1.25rem; }
  .marca svg { width: clamp(44px, 11vw, 62px); height: auto; }
  .marca h1 { font-size: clamp(2.4rem, 11vw, 3.6rem); font-weight:900; letter-spacing:-.03em; }
  .marca .kid { color: var(--tinta); }
  .marca .led { color: var(--ambar); }
  p.lema { font-size: clamp(1rem, 4vw, 1.2rem); color: var(--tenue); }
  p.pronto {
    margin-top: 2rem; font-size:.78rem; letter-spacing:.18em; text-transform:uppercase;
    color: var(--tenue);
  }
  a { color: var(--tinta); text-decoration-color: var(--ambar); text-underline-offset: 3px; }
  @media (prefers-color-scheme: dark) {
    :root { --papel:#0d0f14; --tinta:#f2f4f8; --tenue:#9aa3b2; }
  }
</style>
</head>
<body>
  <main>
    <div class="marca">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 15 Q7 2 16 2 Q25 2 25 15 Z" fill="#FFAD00"/>
        <rect x="7" y="14" width="18" height="11" rx="2" fill="#FFAD00"/>
        <path d="M10 7 Q11 4 14 4" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55"/>
        <rect x="6" y="24" width="20" height="3" rx="1.5" fill="#FFAD00"/>
        <rect x="9" y="27" width="5" height="4" rx="1" fill="#FFAD00"/>
        <rect x="18" y="27" width="5" height="4" rx="1" fill="#FFAD00"/>
      </svg>
      <h1><span class="led">LED</span><span class="kid">KID</span></h1>
    </div>
    <p class="lema">Robótica y electrónica para todos. Simula tu circuito, prográmalo y llévalo a una placa real.</p>
    <p class="pronto">Muy pronto · Guatemala</p>
  </main>
</body>
</html>
