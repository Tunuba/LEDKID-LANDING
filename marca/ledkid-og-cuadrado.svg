<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="LedKid">
  <title>LedKid</title>
  <!-- TARJETA CUADRADA DE MARCA — la que Google usa como miniatura del resultado.
       POR QUE EXISTE, y por que no basta con la og:image de 1200x630: Google recorta
       la miniatura a un CUADRADO de ~92 px. La tarjeta ancha tiene el logotipo
       pequeno y centrado sobre blanco, asi que a ese tamano queda un borron palido
       —es literalmente lo que Meme vio buscando "ledkid"—. Esta llena el cuadro de
       ambar y pone el LED en blanco: se lee a 92 px y a 1200.
       Nada se dibuja a mano: los paths son los MISMOS de marca/ledkid-vertical.svg
       y marca/ledkid-icono-blanco.svg. Si cambia la marca, cambian los dos. -->
  <rect width="1200" height="1200" fill="#FFA000"/>

  <!-- EL LED, en blanco. Mismo path que ledkid-icono-blanco.svg; solo cambia la
       escala. Su caja real es (37.5,10)-(138.5,166), de ahi salen los numeros. -->
  <g transform="translate(312.5,147.33) scale(3.267)">
    <g transform="translate(38,15.5)" fill="none" stroke="#FFFFFF" stroke-width="11">
      <path d="M5,105 V65 Q5,0 50,0 Q95,0 95,65 V105 Q95,115 85,115 H15 Q5,115 5,105 Z" stroke-linejoin="round"/>
      <path d="M5,117 H95" stroke-linecap="round"/>
      <path d="M28,124 V145 M72,124 V145" stroke-linecap="round"/>
    </g>
  </g>

  <!-- "LedKid": los mismos glifos de ledkid-vertical.svg, con el corte de color
       donde lo tiene la marca — "Led" claro, "Kid" oscuro. Sobre ambar el claro
       es BLANCO (en la landing es ambar porque alli el fondo es claro). -->
  <g transform="translate(220,752.1) scale(1.5966)">
    <!-- Led -->
    <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8,48 V132 H50"/>
      <path d="M69.6,106 A31,31 0 1 0 54.5,127.8" transform="translate(78,0)"/>
      <path d="M8,106 H69.6" transform="translate(78,0)" stroke-width="14"/>
      <path d="M70,38 V132" transform="translate(176,0)"/>
    </g>
    <circle cx="215" cy="101" r="31" fill="none" stroke="#FFFFFF" stroke-width="16"/>
    <!-- Kid -->
    <g fill="none" stroke="#1A1D26" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8,48 V132 M58,48 L18,88 M30,78 L60,132" transform="translate(274,0)"/>
      <path d="M8,70 V132" transform="translate(362,0)"/>
      <path d="M70,38 V132" transform="translate(398,0)"/>
    </g>
    <circle cx="370" cy="40" r="8" fill="#1A1D26"/>
    <circle cx="437" cy="101" r="31" fill="none" stroke="#1A1D26" stroke-width="16"/>
  </g>
</svg>
